# --- Deno variant (template, not live) --- #
# Live languages.toml uses tsgo for JS/TS/JSX/TSX (web work).
# For Deno projects, replace the matching blocks in languages.toml with these.

# --- Typescript --- #
[[language]]
name = "typescript"
roots = ["deno.json", "deno.jsonc", "package.json"]
language-servers = ["deno", "biome-lsp-proxy", "scls"]

# --- Javascript --- #
[[language]]
name = "javascript"
roots = ["deno.json", "deno.jsonc", "package.json"]
language-servers = ["deno", "biome-lsp-proxy", "scls"]

# --- JSX --- #
[[language]]
name = "jsx"
roots = ["deno.json", "deno.jsonc", "package.json"]
language-servers = [
  "deno",
  "biome-lsp-proxy",
  "scls",
  "vscode-html-language-server",
  "superhtml",
]

# --- TSX --- #
[[language]]
name = "tsx"
roots = ["deno.json", "deno.jsonc", "package.json"]
language-servers = [
  "deno",
  "biome-lsp-proxy",
  "scls",
  "vscode-html-language-server",
  "superhtml",
]
