# --- Arduino --- #
# arduino-language-server segfaults if the LSP `initialize` request has an empty
# rootUri (ls/ls.go dereferences a nil path). Helix never sends one; Arduino IDE
# 2 always does, which is why upstream never hit it. The wrapper injects it from
# $ARDUINO_SKETCH, falling back to the most recently modified sketch in ~/Arduino.
#
#   ARDUINO_SKETCH=~/Arduino/MySketch hx MySketch/MySketch.ino
[language-server.arduino]
command = "arduino-language-server"
args = [
  "-clangd",
  "/usr/bin/clangd",
  "-cli",
  "/usr/bin/arduino-cli",
  "-cli-config",
  "/home/othman/.arduino15/arduino-cli.yaml",
  "-fqbn",
  "arduino:avr:uno",
]

# --- basedpyright --- #
[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
typeCheckingMode = "standard"

# --- Json --- #
[[language-server.vscode-json-language-server.config.json.schemas]]
fileMatch = ["tsconfig.json", "tsconfig.*.json"]
url = "https://json.schemastore.org/tsconfig.json"

[[language-server.vscode-json-language-server.config.json.schemas]]
