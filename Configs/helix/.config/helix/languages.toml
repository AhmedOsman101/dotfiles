# --- Arduino --- #
# A separate entry so your C++ setup above stays untouched.
# "grammar" points the parser at cpp.so; the highlight/indent queries live in
# ~/.config/helix/runtime/queries/arduino/ and are just "; inherits: cpp",
# so .ino files get identical C++ colouring.
[[language]]
name = "arduino"
scope = "source.cpp"
injection-regex = "arduino"
grammar = "cpp"
file-types = ["ino", "pde"]
language-servers = ["arduino"]
comment-token = "//"
block-comment-tokens = { start = "/*", end = "*/" }
indent = { tab-width = 2, unit = "  " }

