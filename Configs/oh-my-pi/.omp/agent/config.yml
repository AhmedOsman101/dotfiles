modelRoles:
  default: omniroute/auto/best-free
  web: web/public
  image: openrouter/google/gemini-3-pro-image
symbolPreset: unicode
composer:
  shape: box
theme:
  dark: basalt
setupVersion: 2
statusLine:
  transparent: true
  separator: powerline
  preset: default
  contextLine: embedded
tui:
  textSizing: true
  tight: false
terminal:
  showProgress: true
display:
  shimmer: classic
  showTokenUsage: true
task:
  showResolvedModelBadge: true
  eager: preferred
  enableEffort: true
  maxConcurrency: 8
  isolation:
    enabled: false
proseOnlyThinking: false
images:
  describeForTextModels: false
  urls:
    enabled: false
steeringMode: one-at-a-time
interruptMode: immediate
loop:
  mode: prompt
doubleEscapeAction: tree
emojiAutocomplete: false
tools:
  approvalMode: yolo
error:
  notify: "on"
features:
  unexpectedStopDetection: mechanical
branchSummary:
  enabled: false
compaction:
  methodOrder:
    - remote
    - shake
    - handoff
    - soft
  thresholdPercent: 80
  handoffSaveToDisk: true
memory:
  backend: local
mnemopi:
  proactiveLinking: true
readLineNumbers: true
read:
  renderMarkdown: true
  toolResultPreview: true
lsp:
  diagnosticsOnEdit: true
shellMinimizer:
  sourceOutlineLevel: default
  enabled: true
astGrep:
  enabled: true
checkpoint:
  enabled: true
github:
  enabled: true
grep:
  contextBefore: 2
browser:
  cmux: false
  headless: false
  screenshotDir: ~/Pictures/Screenshots/omp
commands:
  enableClaudeProject: false
  enableClaudeUser: false
secrets:
  enabled: true
defaultThinkingLevel: auto
hideThinkingBlock: false
dev:
  autoqaConsent: granted
retry:
  fallbackChains:
    web:
      - web/exa
      - web/duckduckgo
      - web/firecrawl
      - web/parallel
      - web/hosted
      - web/searxng
      - web/startpage
      - web/ecosia
      - web/google
      - web/mojeek
    image:
      - openai/gpt-image-2
      - openai-codex/gpt-image-2
      - google-antigravity/gemini-3-pro-image
      - xai/grok-imagine-image
      - xai-oauth/grok-imagine-image
      - google/gemini-3-pro-image
      - deepinfra/black-forest-labs/FLUX-2-pro