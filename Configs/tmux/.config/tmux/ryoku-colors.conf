# Ryoku palette -> tmux. Rendered by matugen; do not edit.

set -g status-bg                          "#0e0e0e"
set -gq @thm_bar_bg                       "#0e0e0e"

set -gq @thm_bg                           "#131313"
set -gq @thm_fg                           "#e3e3e3"
set -gq @thm_primary                      "#c6c6c6"
set -gq @thm_inverse_primary              "#5e5e5e"
set -gq @thm_surface_low                  "#1b1b1b"
set -gq @thm_surface                      "#1f1f1f"
set -gq @thm_surface_variant              "#2a2a2a"
set -gq @thm_outline                      "#474747"
set -gq @thm_text_variant                 "#c6c6c6"

# Re-set the options that read the vars above.
set -g status-style                       "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g window-active-style                "bg=#{@thm_bg},fg=#{@thm_fg}"
