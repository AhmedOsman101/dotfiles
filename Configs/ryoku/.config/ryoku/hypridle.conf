general {
    lock_cmd = ryoku-shell lock
    inhibit_sleep = 0
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

listener {
    timeout = 120
    on-timeout = ryoku-idle on-battery && ryoku-idle brightness-dim
    on-resume = ryoku-idle brightness-restore
}

listener {
    timeout = 300
    on-timeout = ryoku-idle on-battery && ryoku-shell lock
}

listener {
    timeout = 330
    on-timeout = ryoku-idle on-battery && ryoku-idle output-off
    on-resume = ryoku-idle output-on
}

listener {
    timeout = 900
    on-timeout = ryoku-idle on-battery && ryoku-shell suspend
}

listener {
    timeout = 1800
    on-timeout = ryoku-idle on-ac && ryoku-shell suspend
}
